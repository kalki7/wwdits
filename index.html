<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Note</title>
  <style>
    :root {
      --bg: #05070b;
      --panel: #0b0f17;
      --panel-2: #111827;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #1f2937;
      --accent: #d1d5db;
      --accent-text: #05070b;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, Helvetica, sans-serif;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 860px;
    }

    .card {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0)),
        var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 20px 60px var(--shadow);
      padding: 20px;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.4rem, 5vw, 2.3rem);
      line-height: 1.25;
      word-break: break-word;
    }

    .body-text {
      color: #d1d5db;
      font-size: 1rem;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .actions {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      width: 100%;
      appearance: none;
      border: 0;
      border-radius: 14px;
      padding: 14px 16px;
      background: var(--text);
      color: var(--accent-text);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    button:hover {
      opacity: 0.95;
    }

    button:active {
      transform: scale(0.99);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .status {
      color: var(--muted);
      font-size: 0.92rem;
      text-align: center;
    }

    .error {
      color: #fca5a5;
    }

    @media (min-width: 640px) {
      body {
        padding: 24px;
      }

      .card {
        padding: 28px;
      }

      .actions {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }

      button {
        width: auto;
        min-width: 160px;
      }

      .status {
        text-align: right;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="eyebrow">Random Note</div>
      <h1 id="title">Loading...</h1>
      <div id="selftext" class="body-text">Fetching a random Note...</div>

      <div class="actions">
        <button id="reloadBtn" type="button">Load another</button>
        <div id="status" class="status">Reading shard index...</div>
      </div>
    </section>
  </main>

  <script>
    const INDEX_URL = "site_data/index.json";
    let shardIndex = null;

    function randomInt(max) {
      return Math.floor(Math.random() * max);
    }

    function pickWeightedShard(shards) {
      const total = shards.reduce((sum, shard) => sum + (shard.count || 0), 0);

      if (!total) {
        throw new Error("Index contains no records.");
      }

      let target = Math.floor(Math.random() * total);

      for (const shard of shards) {
        target -= shard.count || 0;
        if (target < 0) return shard;
      }

      return shards[shards.length - 1];
    }

    async function fetchJson(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Failed to fetch ${url}: ${response.status} ${response.statusText}`);
      }
      return response.json();
    }

    async function loadIndex() {
      if (shardIndex) return shardIndex;

      const index = await fetchJson(INDEX_URL);

      if (!index || !Array.isArray(index.shards) || index.shards.length === 0) {
        throw new Error("index.json is missing a valid shards array.");
      }

      shardIndex = index;
      return shardIndex;
    }

    function decodeHtmlEntities(text) {
      const textarea = document.createElement("textarea");
      textarea.innerHTML = text;
      return textarea.value;
    }

    function sanitizeText(text) {
      if (typeof text !== "string") return "";

      let cleaned = decodeHtmlEntities(text);

      cleaned = cleaned
        .replace(/\r\n/g, "\n")
        .replace(/[\$%@#^*_=+~`|<>\\\/]+/g, " ")
        .replace(/[&]+/g, " and ")
        .replace(/\s{2,}/g, " ")
        .replace(/ *\n */g, "\n")
        .trim();

      return cleaned;
    }

    async function loadRandomPost() {
      const titleEl = document.getElementById("title");
      const selftextEl = document.getElementById("selftext");
      const statusEl = document.getElementById("status");
      const buttonEl = document.getElementById("reloadBtn");

      buttonEl.disabled = true;
      statusEl.textContent = "Loading random post...";

      try {
        const index = await loadIndex();
        const shard = pickWeightedShard(index.shards);

        statusEl.textContent = `Loading ${shard.file}...`;
        const entries = await fetchJson(`site_data/${shard.file}`);

        if (!Array.isArray(entries) || entries.length === 0) {
          throw new Error(`Shard ${shard.file} is empty or invalid.`);
        }

        const entry = entries[randomInt(entries.length)];

        const cleanTitle = sanitizeText(entry.title || "Untitled");
        const cleanBody = sanitizeText(entry.selftext || "");

        titleEl.textContent = cleanTitle || "Untitled";
        selftextEl.textContent = cleanBody || "No text available.";
        statusEl.textContent = "Loaded";
      } catch (error) {
        titleEl.textContent = "Could not load post";
        selftextEl.innerHTML = `<span class="error">${error.message}</span>`;
        statusEl.textContent = "Error";
      } finally {
        buttonEl.disabled = false;
      }
    }

    document.getElementById("reloadBtn").addEventListener("click", loadRandomPost);
    loadRandomPost();
  </script>
</body>
</html>
