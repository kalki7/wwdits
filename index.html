<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memento Mori</title>
  <style>
    :root {
      --bg: #05070b;
      --panel: #0b0f17;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #1f2937;
      --accent: #d1d5db;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin: 0;
      opacity: 0;
      animation: fadeIn 2s ease-out forwards;
    }

    .vivere {
      color: var(--muted);
      font-size: clamp(1rem, 4vw, 2rem);
      margin-top: 1rem;
      animation-delay: 1s;
    }

    .enter-link {
      margin-top: 4rem;
      display: inline-block;
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      padding: 10px 20px;
      border: 1px solid var(--border);
      border-radius: 4px;
      transition: all 0.3s ease;
      opacity: 0;
      animation: fadeIn 2s ease-out 2s forwards;
    }

    .enter-link:hover {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Subtle background effect */
    .bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(5,7,11,0) 70%);
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">
    <h1>memento mori</h1>
    <h1 class="vivere">memento vivere</h1>
    <!-- <a href="wwdits.html" class="enter-link">Enter</a> -->
  </div>
</body>
</html>
